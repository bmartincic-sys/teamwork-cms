<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16211C">
<title>The Unified Commerce Trail — Powered by Teamwork Commerce</title>
<link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
<link rel="shortcut icon" href="/assets/images/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Cartography */
  --paper:#F2F0E6;
  --paper-2:#E8E5D6;
  --contour:#CFC4A8;
  --contour-major:#B3A480;
  --forest:#DCE8C6;
  --forest-2:#CCDCAE;
  --water:#B4D6E8;
  --water-line:#87B4CC;

  /* Ink */
  --ink:#16211C;
  --ink-2:#525E57;
  --ink-3:#8A948E;
  --hair:#E2DED4;
  --hair-2:#EDE9E0;

  /* Teamwork */
  --blue:#247DFF;
  --blue-deep:#0B4FB8;
  --purple:#7C50F5;
  --purple-soft:#F1ECFF;
  --pin:#1D5134;
  --pin-done:#1F7A4D;

  --sheet-h-peek:188px;
  --nav-h:60px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);

  --font-display:"SF Compact Display","SF Pro Display",-apple-system,BlinkMacSystemFont,"Inter Tight",Inter,system-ui,sans-serif;
  --font-body:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--paper);
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* ---------- App shell (phone frame on desktop, edge-to-edge on mobile) ---------- */
#app{
  position:fixed;inset:0;
  background:var(--paper);overflow:hidden;
  display:flex;flex-direction:column;
}

/* ---------- Splash ---------- */
#splash{
  position:absolute;inset:0;z-index:60;background:#16211C;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  transition:opacity .5s ease,visibility .5s;
}
#splash.gone{opacity:0;visibility:hidden}
#splash svg{width:118px;height:118px}
#splash .mark path{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;
  stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.15s cubic-bezier(.65,0,.35,1) forwards}
#splash .mark circle{fill:var(--blue);opacity:0;animation:pop .45s .85s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
#splash .wd{font-family:var(--font-display);color:#fff;font-size:13px;letter-spacing:.22em;text-transform:uppercase;opacity:0;animation:fadeIn .5s .9s forwards}
@keyframes fadeIn{to{opacity:.75}}

/* ---------- Header ---------- */
header{
  position:relative;z-index:30;flex:none;
  padding:calc(var(--safe-t) + 12px) 14px 10px;
  background:rgba(243,239,231,.93);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--hair);
  pointer-events:none;
}
header > *{pointer-events:auto}
.hrow{display:flex;align-items:center;gap:10px}
.iconbtn{
  width:36px;height:36px;flex:none;border:none;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(22,33,28,.18);
  display:grid;place-items:center;cursor:pointer;color:var(--ink);
}
.iconbtn:active{transform:scale(.94)}
.htitle{flex:1;min-width:0}
.htitle .eyebrow{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);
}
.eyebrow-brand{display:flex;align-items:center;gap:6px;}
.eyebrow-logo{height:19px;width:auto;display:block;position:relative;top:-1px;}
.htitle h1{
  margin:1px 0 0;font-family:var(--font-display);font-weight:700;
  font-size:19px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;background:#fff;border:1px solid var(--hair);border-radius:999px;
  padding:6px 11px;font-size:11.5px;font-weight:600;letter-spacing:-.01em;
  box-shadow:0 1px 3px rgba(22,33,28,.07);white-space:nowrap;
}
.chip b{color:var(--blue);font-weight:700}

/* ---------- Map ---------- */
#mapwrap{position:absolute;inset:0;z-index:1;touch-action:none;cursor:grab;background:var(--paper)}
#mapwrap.dragging{cursor:grabbing}
#map{width:100%;height:100%;display:block}
.pin{cursor:pointer}
.pin .body{fill:var(--pin);stroke:#fff;stroke-width:2.2;transition:fill .25s}
.pin.done .body{fill:var(--pin-done)}
.pin.active .body{fill:var(--blue)}
.pin .num{fill:#fff;font-family:var(--font-display);font-weight:700;font-size:17px;
  text-anchor:middle;letter-spacing:-.02em}
.pin .halo{display:none}
.pin:focus{outline:none}
.pin:focus-visible .ring{stroke:var(--blue);stroke-width:3;opacity:1}
.pin .ring{fill:none;stroke:transparent;opacity:0}
.pin #summitflag{cursor:pointer}
#summitflag .splate{fill:#fff;stroke:rgba(22,33,28,.25);stroke-width:1.6}
#summitflag .sflag-pole{stroke:#3A4552;stroke-width:2;stroke-linecap:round;fill:none}
#summitflag .sflag{fill:var(--purple);stroke-linejoin:round}
#summitflag.on .splate{stroke:var(--purple);stroke-width:2.6}
.label{
  font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;fill:var(--ink);text-anchor:middle;
  paint-order:stroke;stroke:var(--paper);stroke-width:5px;
}
.maplabel{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;
  fill:#7F7358;paint-order:stroke;stroke:var(--paper);stroke-width:4px;
}
.trail-casing{fill:none;stroke:#fff;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.trail{fill:none;stroke:var(--blue);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:14 9}
.ret{fill:none;stroke:var(--purple);stroke-width:4;stroke-linecap:round;
  stroke-dasharray:9 8;opacity:0;pointer-events:none}
.ret.on{opacity:1;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-34}}

/* Basecamp */
#basecamp{cursor:pointer}
#basecamp .pulse{fill:var(--blue);opacity:.14;animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{r:26;opacity:.22}70%{r:58;opacity:0}100%{opacity:0}}
#basecamp .plate{fill:#fff;stroke:var(--blue);stroke-width:2.5}
#basecamp .cap{fill:var(--blue)}
#basecamp .name{font-family:var(--font-display);font-weight:700;font-size:14px;fill:var(--ink);
  text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:4px}

/* Map furniture */
.legend{
  position:absolute;left:12px;bottom:calc(var(--sheet-h-peek) + var(--nav-h) + var(--safe-b) + 12px);
  z-index:20;background:rgba(255,255,255,.94);border:1px solid var(--hair);border-radius:10px;
  padding:8px 10px;font-family:var(--font-mono);font-size:9px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink-2);box-shadow:0 2px 8px rgba(22,33,28,.1);
  transition:opacity .3s,transform .3s;
}
.legend.hide{opacity:0;transform:translateY(8px);pointer-events:none}
.legend div{display:flex;align-items:center;gap:7px}
.legend div + div{margin-top:5px}
.legend i{width:18px;height:0;border-top:3px solid;display:block;border-radius:2px}
.legend .l-trail{border-color:var(--blue)}
.legend .l-ret{border-top-style:dashed;border-color:var(--purple)}
.legend .l-pin{width:9px;height:9px;border:none;border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);background:var(--pin)}
.zoomer{
  position:absolute;right:12px;bottom:calc(var(--sheet-h-peek) + var(--nav-h) + var(--safe-b) + 12px);
  z-index:20;display:flex;flex-direction:column;background:#fff;border-radius:10px;overflow:hidden;
  box-shadow:0 2px 8px rgba(22,33,28,.14);transition:opacity .3s,transform .3s;
}
.zoomer.hide{opacity:0;transform:translateY(8px);pointer-events:none}
.zoomer button{
  width:36px;height:36px;border:none;background:#fff;font-size:17px;color:var(--ink);cursor:pointer;
  font-family:var(--font-display);
}
.zoomer button + button{border-top:1px solid var(--hair-2)}
.zoomer button:active{background:var(--hair-2)}

/* ---------- Sheet ---------- */
#sheet{
  position:absolute;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b));
  z-index:25;height:78vh;max-height:640px;background:#fff;
  border-radius:20px 20px 0 0;box-shadow:0 -8px 34px rgba(22,33,28,.2);
  display:flex;flex-direction:column;
  transform:translateY(calc(100% - var(--sheet-h-peek)));
  transition:transform .38s cubic-bezier(.32,.72,0,1);
  /* touch-action:none here vetoed the body's pan-y (effective touch-action is the
     intersection with every ancestor), which killed touch scrolling in the sheet.
     Only the grab handle needs the veto, for its drag gesture. */
  touch-action:pan-y;
}
#sheet.half{transform:translateY(38%)}
#sheet.full{transform:translateY(0)}
#sheet.dragging{transition:none}
.grab{flex:none;padding:9px 0 4px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab span{width:38px;height:4px;border-radius:2px;background:#DCD8CE}
#sheetbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px 26px;
  overscroll-behavior:contain;touch-action:pan-y}

/* Sheet content */
.kicker{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;
  color:var(--ink-3);display:flex;align-items:center;gap:8px;
}
.kicker .dot{width:5px;height:5px;border-radius:50%;background:var(--blue)}
.s-title{
  font-family:var(--font-display);font-weight:700;font-size:23px;line-height:1.15;
  letter-spacing:-.025em;margin:7px 0 0;
}
.s-sub{color:var(--ink-2);font-size:14.5px;margin:9px 0 0}
/* AllTrails-style trail detail head */
.hero{position:relative;margin:0 -18px;overflow:hidden;background:#DDD8CC}
.hero .track{
  display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  touch-action:pan-x;cursor:grab;
}
.hero .track.grabbing{cursor:grabbing;scroll-snap-type:none}
.hero .track::-webkit-scrollbar{display:none}
.hero .track > figure{flex:none;width:100%;margin:0;scroll-snap-align:center}
.hero img{width:100%;height:214px;object-fit:cover;display:block}
.hero .arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border:none;border-radius:50%;cursor:pointer;
  background:rgba(255,255,255,.94);box-shadow:0 2px 8px rgba(15,20,17,.3);
  display:grid;place-items:center;color:var(--ink);z-index:2;
}
.hero .arrow.prev{left:10px}
.hero .arrow.next{right:10px}
.hero .arrow:disabled{opacity:0;pointer-events:none}
.hero .dots{
  position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px;z-index:2;
}
.hero .dots i{
  width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);
  box-shadow:0 1px 2px rgba(0,0,0,.3);transition:background .2s,width .2s;
}
.hero .dots i.on{background:#fff;width:18px;border-radius:3px}
.hero .count{
  position:absolute;right:12px;bottom:12px;background:rgba(15,20,17,.66);color:#fff;
  border-radius:999px;padding:4px 10px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;
}
.t-title{
  font-family:var(--font-display);font-weight:700;font-size:27px;line-height:1.08;
  letter-spacing:-.032em;margin:16px 0 0;
}
.t-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:10px 0 0;font-size:13px;color:var(--ink-2)}
.pill{
  background:#E6F0FF;color:var(--blue-deep);border-radius:6px;padding:3px 8px;
  font-size:11.5px;font-weight:700;
}
.t-meta .sep{color:#C9C3B4}
.t-place{color:var(--ink-3);font-size:13.5px;margin:5px 0 0}
.statbar{
  display:flex;margin:16px 0 0;padding:14px 0;
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
}
.statbar div{flex:1;padding-right:8px}
.statbar b{display:block;font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:-.02em}
.statbar span{display:block;font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.3}
.actions{display:flex;gap:4px;margin:12px 0 0}
.act{flex:1;background:none;border:none;cursor:pointer;padding:6px 0;
  display:flex;flex-direction:column;align-items:center;gap:6px}
.act i{width:42px;height:42px;border-radius:50%;background:#EAF2FF;display:grid;place-items:center;
  font-style:normal;color:var(--blue)}
.act.on i{background:var(--blue);color:#fff}
.act span{font-size:11px;font-weight:600;color:var(--ink-2)}
.act:active i{transform:scale(.93)}
.desc{font-size:14.5px;color:var(--ink-2);margin:16px 0 0;line-height:1.55}

/* Photo strip */
.gallery{
  display:flex;gap:8px;margin:16px -18px 0;padding:0 18px 2px;
  overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
}
.gallery::-webkit-scrollbar{display:none}
.shot{
  flex:none;width:178px;aspect-ratio:4/3;border-radius:12px;overflow:hidden;
  scroll-snap-align:start;position:relative;background:var(--ink);
}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot > svg{width:100%;height:100%;display:block}
.shot .cap2{
  position:absolute;left:0;right:0;bottom:0;padding:16px 9px 8px;
  font-family:var(--font-mono);font-size:8px;letter-spacing:.09em;text-transform:uppercase;
  color:rgba(255,255,255,.88);
  background:linear-gradient(180deg,transparent,rgba(10,16,13,.86));
}
.shot .ph{
  position:absolute;inset:0;padding:10px;display:flex;flex-direction:column;
  justify-content:flex-end;gap:6px;
  background:linear-gradient(155deg,#243B32,#16211C 70%);
}
.shot .ph svg{opacity:.4}
.shot .ph em{
  font-family:var(--font-mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(255,255,255,.72);font-style:normal;line-height:1.4;
}
.meta{
  display:flex;align-items:center;gap:9px;margin:10px 0 0;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);
}
.meta i{width:3px;height:3px;border-radius:50%;background:var(--ink-3);font-style:normal}

/* Trail reports */
.rev{border:1px solid var(--hair);border-radius:14px;padding:14px;margin-top:9px;background:#fff}
.rev-head{display:flex;align-items:center;gap:10px}
.avatar{
  width:32px;height:32px;flex:none;border-radius:50%;background:var(--pin);color:#fff;
  display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:13px;
}
.rev-who{min-width:0;flex:1}
.rev-who b{display:block;font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:-.01em}
.rev-who span{
  display:block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);margin-top:2px;
}
.rev-q{margin:11px 0 0;font-size:14px;line-height:1.55;color:var(--ink-2)}
.rev-metric{
  display:inline-flex;align-items:center;gap:6px;margin:11px 0 0;
  background:#F0F5FF;color:var(--blue-deep);border-radius:999px;padding:5px 11px;
  font-size:11.5px;font-weight:600;
}
.rev.todo{background:#FCFBF8;border-style:dashed}
.rev.todo .rev-q{color:var(--ink-3);font-family:var(--font-mono);font-size:11.5px;line-height:1.6}

.statrow{display:flex;gap:0;margin:16px 0 0;border:1px solid var(--hair);border-radius:12px;overflow:hidden}
.stat{flex:1;padding:11px 10px;text-align:center}
.stat + .stat{border-left:1px solid var(--hair)}
.stat b{display:block;font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-.02em}
.stat span{display:block;font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.btn{
  display:block;width:100%;border:none;border-radius:12px;padding:14px;cursor:pointer;
  font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:-.01em;
  background:var(--blue);color:#fff;margin-top:14px;
}
.btn:active{transform:scale(.985)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--hair)}
.btn.dark{background:var(--ink)}

/* Media slot */
.media{
  margin:16px 0 0;border-radius:14px;overflow:hidden;background:var(--ink);
  position:relative;aspect-ratio:16/9;display:grid;place-items:center;cursor:pointer;
}
.media video,.media img{width:100%;height:100%;object-fit:cover;display:block}
.media .veil.sheer{background:linear-gradient(180deg,rgba(10,16,13,.05),rgba(10,16,13,.34))}
.media .cap2{
  position:absolute;left:0;right:0;bottom:0;padding:20px 12px 9px;
  font-family:var(--font-mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;
  color:rgba(255,255,255,.9);background:linear-gradient(180deg,transparent,rgba(10,16,13,.82));
}
.media.still{cursor:default}
.media video{pointer-events:none;background:var(--ink)}
.media .veil{
  position:absolute;inset:0;background:
    radial-gradient(120% 120% at 30% 20%,rgba(36,125,255,.4),transparent 60%),
    linear-gradient(160deg,#1B2A38,#16211C);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;padding:16px;
}
.media .play{
  width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
}
.media .cap{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.82);max-width:80%}
.media.empty .veil{cursor:default}
.slotnote{
  font-family:var(--font-mono);font-size:10px;line-height:1.5;color:var(--ink-3);
  margin:7px 0 0;letter-spacing:.01em;
}

/* Road back to POS */
.road{
  margin:18px 0 0;border-radius:14px;background:var(--purple-soft);
  border:1px solid #E1D7FF;padding:14px 15px;position:relative;overflow:hidden;
}
.road::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--purple);
}
.road .rk{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--purple);display:flex;align-items:center;gap:7px;
}
.road p{margin:8px 0 0;font-size:14px;color:#2C2350;line-height:1.5}
.stepper{display:flex;align-items:center;gap:10px;margin:14px 0 2px}
.sbtn{
  width:34px;height:34px;flex:none;border-radius:50%;border:1.5px solid var(--hair);
  background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--ink);
}
.sbtn:disabled{opacity:.3;cursor:default}
.sbtn:active:not(:disabled){transform:scale(.93)}
.dots{flex:1;display:flex;gap:6px;justify-content:center}
.dots button{
  width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;
  background:#EDE8DD;color:var(--ink-2);font-family:var(--font-mono);font-size:10.5px;
}
.dots button.seen{background:#D8E8FF;color:var(--blue-deep)}
.dots button.on{background:var(--blue);color:#fff;font-weight:600}
.badge{
  display:inline-flex;align-items:center;gap:7px;margin:16px 0 0;
  background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px 8px 10px;
  font-size:12.5px;font-weight:600;letter-spacing:-.01em;
}
.badge i{width:16px;height:16px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-style:normal}
.badge i svg{display:block}

/* Stop list */
.listwrap{padding-top:4px}
.lcard{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:#fff;border:1px solid var(--hair);border-radius:14px;padding:13px;cursor:pointer;
  margin-top:9px;font-family:var(--font-body);
}
.lcard:active{background:#FAF8F3}
.lnum{
  flex:none;width:26px;height:26px;border-radius:50% 50% 50% 4px;background:var(--pin);color:#fff;
  display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:13px;
}
.lcard.done .lnum{background:var(--pin-done)}
.lcard h4{margin:0;font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.lcard p{margin:4px 0 0;font-size:12.5px;color:var(--ink-3);
  font-family:var(--font-mono);letter-spacing:.02em}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0 4px;
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.divider::after{content:"";flex:1;height:1px;background:var(--hair)}

/* Summit / conversion */
.summit{padding-top:6px}
.summit .hero{
  border-radius:16px;padding:20px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(155deg,#0B4FB8,#247DFF 55%,#7C50F5);
}
.summit .hero svg.topo{position:absolute;inset:0;width:100%;height:100%;opacity:.16}
.summit .hero .in{position:relative}
.summit .hero .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;opacity:.8}
.summit .hero h2{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:-.03em;
  line-height:1.13;margin:8px 0 0}
.summit .hero p{margin:11px 0 0;font-size:14px;line-height:1.5;color:rgba(255,255,255,.9)}
.roi{display:flex;margin:16px 0 0;border:1px solid var(--hair);border-radius:12px;overflow:hidden}
.logorow{margin:20px 0 0;text-align:center}
.logorow .lbl{
  font-family:var(--font-mono);font-size:9px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--ink-3);display:flex;align-items:center;gap:10px;justify-content:center;
}
.logorow .lbl::before,.logorow .lbl::after{content:"";height:1px;flex:1;background:var(--hair)}
.logos{
  display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 0;justify-content:center;align-items:center;
}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 0}
.tags span{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--hair);border-radius:999px;padding:6px 11px;
  font-size:12px;font-weight:500;letter-spacing:-.01em;color:var(--ink-2);background:#FCFBF8;
}
.tags span::before{
  content:"";width:5px;height:5px;border-radius:50%;background:var(--blue);flex:none;
}
.logos .lg{
  display:inline-flex;align-items:center;justify-content:center;min-height:38px;
  border:1px solid var(--hair);border-radius:10px;padding:8px 14px;background:#FCFBF8;
}
.logos .lg span{
  font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.02em;
  color:var(--ink);text-transform:uppercase;
}
.logos .lg img{width:auto;max-width:112px;display:block;object-fit:contain}
.fine{font-family:var(--font-mono);font-size:9.5px;line-height:1.6;color:var(--ink-3);margin:14px 0 0;letter-spacing:.02em}

/* Progress banner */
#toast{
  position:absolute;left:14px;right:14px;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);
  z-index:40;background:var(--ink);color:#fff;border-radius:14px;padding:13px 15px;
  display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);
  transform:translateY(140%);transition:transform .45s cubic-bezier(.32,.72,0,1);
}
#toast.show{transform:translateY(0)}
#toast .t{flex:1;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
#toast .t small{display:block;font-weight:400;opacity:.7;font-size:11.5px;margin-top:2px}
#toast button{
  flex:none;border:none;background:var(--blue);color:#fff;border-radius:9px;padding:9px 13px;
  font-family:var(--font-display);font-weight:600;font-size:12.5px;cursor:pointer;
}

/* ---------- Bottom nav ---------- */
nav{
  position:absolute;left:0;right:0;bottom:0;z-index:45;height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--hair);display:flex;
}
nav button{
  flex:1;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:var(--ink-3);padding:0;
}
nav button.on{color:var(--blue)}
nav button span{font-family:var(--font-mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase}
nav .prog{position:absolute;top:0;left:0;height:2px;background:var(--blue);transition:width .5s cubic-bezier(.32,.72,0,1)}

.hidden{display:none !important}

/* ---------- Desktop: map fills the screen, content docks to a left panel ---------- */
@media (max-width:899px){
  #sheet.deep{top:112px;height:auto;max-height:none}
  #sheet.deep .grab{display:none}
  #sheet.deep #sheetbody{padding-top:20px}
}
@media (max-width:400px){
  .htitle h1{font-size:17px}
}
@media (min-width:900px){

  :root{--panel-w:420px}
  body:not(.framed) #mapwrap{left:var(--panel-w)}
  body:not(.framed) header{
    position:absolute;top:0;left:0;width:var(--panel-w);height:122px;
    background:#fff;border-bottom:1px solid var(--hair);border-right:1px solid var(--hair);
    padding:20px 22px 14px;z-index:31;backdrop-filter:none;
  }
  body:not(.framed) header h1{font-size:21px}
  body:not(.framed) #sheet{
    top:122px;left:0;width:var(--panel-w);height:auto;max-height:none;
    border-radius:0;border-right:1px solid var(--hair);
    box-shadow:none;transform:none !important;transition:none;
  }
  body:not(.framed) #sheet .grab{display:none}
  body:not(.framed) #sheetbody{padding:18px 22px 30px}
  body:not(.framed) .s-title{font-size:25px}
  body:not(.framed) nav{left:0;width:var(--panel-w);border-right:1px solid var(--hair)}
  body:not(.framed) .legend{left:calc(var(--panel-w) + 16px);bottom:16px}
  body:not(.framed) .zoomer{right:16px;bottom:16px}
  body:not(.framed) #toast{left:calc(var(--panel-w) + 16px);right:16px;bottom:16px;max-width:420px}
  body:not(.framed) .legend.hide, body:not(.framed) .zoomer.hide{opacity:1;transform:none;pointer-events:auto}


  /* Device-frame presentation: the app sits on a dark backdrop instead of filling the screen. */
  body.framed{display:flex;align-items:center;justify-content:center;background:#0E1512}
  body.framed #app{
    position:relative;inset:auto;
    width:440px;height:min(92vh,940px);
    border-radius:36px;overflow:hidden;
    box-shadow:0 40px 120px rgba(0,0,0,.55);
  }
}
@media (min-width:1400px){
  :root{--panel-w:468px}
  body:not(.framed) #sheetbody{padding:22px 28px 34px}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>

function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* Smooth closed path through points (Catmull-Rom → cubic bezier) */
function closedPath(pts){
  const n = pts.length;
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n; i++){
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)} ${c1[1].toFixed(1)},${c2[0].toFixed(1)} ${c2[1].toFixed(1)},${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d + "Z";
}
/* Wobbly ring — a contour line */
function ring(cx, cy, r, seed, wob){
  const rnd = mulberry32(seed);
  const ph = [rnd() * 6.28, rnd() * 6.28, rnd() * 6.28];
  const pts = [];
  const N = 46;
  for (let i = 0; i < N; i++){
    const a = (i / N) * Math.PI * 2;
    const k = 1
      + wob * 0.55 * Math.sin(2 * a + ph[0])
      + wob * 0.30 * Math.sin(3 * a + ph[1])
      + wob * 0.16 * Math.sin(5 * a + ph[2]);
    pts.push([cx + Math.cos(a) * r * k, cy + Math.sin(a) * r * k * 0.86]);
  }
  return closedPath(pts);
}

/* Progress roads (drawn under the trail). Each stop's highlight retraces the trail
   itself from basecamp, through every earlier stop, to the selected one — click stop 3
   and the route runs basecamp → 1 → 2 → 3. loopPts below is the single source of the
   trail's seeded drift: the visible trail and every highlight are sliced from it, so
   they always sit on the same line. */
const roads = el("g", {}, viewport);
function loopPts(){
  const rnd = mulberry32(2468);
  const nodes = [[HUB.x, HUB.y], ...STOPS.map(s => [s.x, s.y])];
  const pts = [];
  for (let i = 0; i < nodes.length; i++){
    const a = nodes[i], b = nodes[(i + 1) % nodes.length];
    pts.push(a);
    const dx = b[0] - a[0], dy = b[1] - a[1];
    [0.30, 0.58, 0.82].forEach(t => {
      const off = (rnd() - 0.5) * 0.15;
      pts.push([a[0] + dx * t - dy * off, a[1] + dy * t + dx * off]);
    });
  }
  return pts;
}
/* Open Catmull-Rom, clamped at the ends: the same smoothing closedPath uses, minus
   the wrap-around, so a partial trail keeps the trail's hand-drawn character. */
function openPath(pts){
  const n = pts.length;
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++){
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n - 1, i + 2)];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)} ${c1[1].toFixed(1)},${c2[0].toFixed(1)} ${c2[1].toFixed(1)},${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}

/* ---------------- Pan & zoom ---------------- */
let tx = 0, ty = 0, k = 1;
const MINK = .3, MAXK = 3.2;
const wrap = document.getElementById("mapwrap");

const isDesktop = () => !document.body.classList.contains("framed")
  && matchMedia("(min-width:900px)").matches;

/* FIT = pixels per map unit before zoom. Cached, since it only changes on resize.
   Everything inside a .cscale group is counter-scaled by it, so pins and map
   labels render at a fixed pixel size on every screen. */
let FIT = 1;
function measure(){
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  FIT = Math.max(r.width / vb.width, r.height / vb.height) || 1;
}
function applyTransform(){
  viewport.setAttribute("transform", `translate(${tx.toFixed(2)},${ty.toFixed(2)}) scale(${k.toFixed(3)})`);
  const inv = (1 / (k * FIT)).toFixed(4);
  document.querySelectorAll(".cscale").forEach(n => n.setAttribute("transform", `scale(${inv})`));
}
function clientToSvg(cx, cy){
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const sc = Math.max(r.width / vb.width, r.height / vb.height);
  return {
    x: (cx - r.left - (r.width - vb.width * sc) / 2) / sc,
    y: (cy - r.top - (r.height - vb.height * sc) / 2) / sc
  };
}
function zoomAt(px, py, factor){
  const nk = Math.min(MAXK, Math.max(MINK, k * factor));
  const f = nk / k;
  tx = px - (px - tx) * f;
  ty = py - (py - ty) * f;
  k = nk;
  applyTransform();
}
/* Center a point in the visible map area (above the sheet) */
function centerOn(x, y, targetK, visibleFrac = .46){
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const sc = Math.max(r.width / vb.width, r.height / vb.height);
  const nk = targetK !== undefined ? targetK : k;
  const cx = vb.width / 2, cy = vb.height * visibleFrac;
  const from = { tx, ty, k };
  const to = { tx: cx - x * nk, ty: cy - y * nk, k: nk };
  const t0 = performance.now(), dur = 520;
  const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
  if (reduce){ tx = to.tx; ty = to.ty; k = to.k; applyTransform(); return; }
  (function step(now){
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    tx = from.tx + (to.tx - from.tx) * e;
    ty = from.ty + (to.ty - from.ty) * e;
    k  = from.k  + (to.k  - from.k)  * e;
    applyTransform();
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

/* Frame the entire loop inside whatever space the map actually has. */
function homeView(){
  const r = svg.getBoundingClientRect();
  const desk = isDesktop();
  const bw = LOOP_BOX.x1 - LOOP_BOX.x0, bh = LOOP_BOX.y1 - LOOP_BOX.y0;
  const chrome = desk ? 150 : 118 + 188 + 60 + 22;   // header, sheet peek, nav
  const availW = r.width - (desk ? 90 : 40);
  const availH = Math.max(180, r.height - chrome);
  let kk = Math.min(availW / (bw * FIT), availH / (bh * FIT));
  kk = Math.min(MAXK, Math.max(MINK, kk));
  const frac = desk ? .5 : Math.max(.3, ((118 + (r.height - 248)) / 2) / r.height);
  return { x: (LOOP_BOX.x0 + LOOP_BOX.x1) / 2, y: (LOOP_BOX.y0 + LOOP_BOX.y1) / 2, k: kk, frac };
}
function goHome(animate){
  const v = homeView();
  centerOn(v.x, v.y, v.k, v.frac);
}

let ptrs = new Map(), last = null, pinchStart = null, moved = false;
wrap.addEventListener("pointerdown", e => {
  /* Capturing here would retarget the eventual click to the wrapper and the pins
     would never receive it. Capture starts in pointermove, once it is a real drag. */
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = false;
  if (ptrs.size === 1){ last = { x: e.clientX, y: e.clientY }; wrap.classList.add("dragging"); }
  if (ptrs.size === 2){
    const [a, b] = [...ptrs.values()];
    pinchStart = { d: Math.hypot(a.x - b.x, a.y - b.y), k };
  }
});
wrap.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2 && pinchStart){
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const mid = clientToSvg((a.x + b.x) / 2, (a.y + b.y) / 2);
    const target = Math.min(MAXK, Math.max(MINK, pinchStart.k * (d / pinchStart.d)));
    zoomAt(mid.x, mid.y, target / k);
    moved = true;
    try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
    return;
  }
  if (ptrs.size === 1 && last){
    const r = svg.getBoundingClientRect();
    const vb = svg.viewBox.baseVal;
    const sc = Math.max(r.width / vb.width, r.height / vb.height);
    const dx = (e.clientX - last.x) / sc, dy = (e.clientY - last.y) / sc;
    if (Math.abs(dx) + Math.abs(dy) > 1) {
      moved = true;
      try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
    }
    tx += dx; ty += dy;
    last = { x: e.clientX, y: e.clientY };
    applyTransform();
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinchStart = null;
  if (ptrs.size === 0){ last = null; wrap.classList.remove("dragging"); }
}
wrap.addEventListener("pointerup", endPtr);
wrap.addEventListener("pointercancel", endPtr);
wrap.addEventListener("wheel", e => {
  e.preventDefault();
  const p = clientToSvg(e.clientX, e.clientY);
  zoomAt(p.x, p.y, e.deltaY < 0 ? 1.12 : 1 / 1.12);
}, { passive: false });

const sheet = document.getElementById("sheet");

const grab = document.getElementById("grab");

function setSheet(state){
  if (isDesktop()) state = "full";
  sheet.classList.remove("half", "full");
  if (state !== "peek") sheet.classList.add(state);
  const hideFurniture = state === "full";
  legend.classList.toggle("hide", hideFurniture);
  zoomer.classList.toggle("hide", hideFurniture);
  body.scrollTop = 0;
}

let sy = 0, sBase = 0, sDrag = false;
const stateY = () => sheet.classList.contains("full") ? 0
  : sheet.classList.contains("half") ? sheet.offsetHeight * .38
  : sheet.offsetHeight - parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sheet-h-peek"));

grab.addEventListener("pointerdown", e => {
  if (isDesktop() || sheet.classList.contains("deep")) return;
  grab.setPointerCapture(e.pointerId);
  sDrag = true; sy = e.clientY; sBase = stateY();
  sheet.classList.add("dragging");
});
grab.addEventListener("pointermove", e => {
  if (!sDrag) return;
  const y = Math.max(0, Math.min(sheet.offsetHeight - 60, sBase + (e.clientY - sy)));
  sheet.style.transform = `translateY(${y}px)`;
});
grab.addEventListener("pointerup", e => {
  if (!sDrag) return;
  sDrag = false;
  sheet.classList.remove("dragging");
  sheet.style.transform = "";
  const y = sBase + (e.clientY - sy);
  const h = sheet.offsetHeight;
  const snaps = [{ s: "full", y: 0 }, { s: "half", y: h * .38 }, { s: "peek", y: h - 188 }];
  snaps.sort((a, b) => Math.abs(a.y - y) - Math.abs(b.y - y));
  setSheet(snaps[0].s);
});
grab.addEventListener("click", () => {
  if (isDesktop() || sheet.classList.contains("deep")) return;
  setSheet(sheet.classList.contains("full") ? "half" : "full");
});

/* Photo carousel: swipe on touch, arrows and click-drag on desktop. */
function wireCarousel(){
  const track = body.querySelector("#herotrack");
  if (!track) return;
  const n = track.children.length;
  const count = body.querySelector("#herocount");
  const dots = body.querySelector("#herodots");
  const prev = body.querySelector("#heroprev");
  const next = body.querySelector("#heronext");
  const index = () => Math.round(track.scrollLeft / track.clientWidth);

  function sync(){
    const i = Math.min(n - 1, Math.max(0, index()));
    if (count) count.textContent = `${i + 1} / ${n}`;
    if (dots) [...dots.children].forEach((d, j) => d.classList.toggle("on", j === i));
    if (prev) prev.disabled = i === 0;
    if (next) next.disabled = i === n - 1;
  }
  function goTo(i){
    track.scrollTo({ left: Math.min(n - 1, Math.max(0, i)) * track.clientWidth, behavior: "smooth" });
  }
  track.addEventListener("scroll", sync, { passive: true });
  if (prev) prev.onclick = () => goTo(index() - 1);
  if (next) next.onclick = () => goTo(index() + 1);

  /* Click-and-drag, for mice */
  let down = false, sx = 0, sl = 0, moved = false;
  track.addEventListener("pointerdown", e => {
    if (e.pointerType === "touch") return;
    down = true; moved = false; sx = e.clientX; sl = track.scrollLeft;
    track.classList.add("grabbing");
  });
  track.addEventListener("pointermove", e => {
    if (!down) return;
    const d = e.clientX - sx;
    if (Math.abs(d) > 3) moved = true;
    track.scrollLeft = sl - d;
  });
  const release = () => {
    if (!down) return;
    down = false;
    track.classList.remove("grabbing");
    if (moved) goTo(index());
  };
  track.addEventListener("pointerup", release);
  track.addEventListener("pointerleave", release);
  sync();
}

        <div class="lnum">${o.id}</div>
        <div><h4>${esc(o.title)}</h4><p>${esc(o.metric)}</p></div>
      </button>`).join("")}`;
  wireBody();
}

function renderStop(s){
  body.innerHTML = `
    <div class="kicker"><span class="dot"></span> Stop ${s.id} of 5 · ${esc(s.nav)}</div>
    <div class="stepper">
      <button class="sbtn" data-step="-1" ${s.id === 1 ? "disabled" : ""} aria-label="Previous stop">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="dots">${STOPS.map(o => `<button data-go="${o.id}" class="${
        o.id === s.id ? "on" : (visited.has(o.id) ? "seen" : "")
      }" aria-label="Stop ${o.id}">${o.id}</button>`).join("")}</div>
      <button class="sbtn" data-step="1" aria-label="${s.id === 5 ? "Go to summit" : "Next stop"}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <h2 class="s-title">${esc(s.title)}</h2>
    <p class="s-sub">${esc(s.desc)}</p>
    ${mediaBlock(s)}
    <div class="road">
      <div class="rk">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l-6-6 6-6"/><path d="M3 12h11a6 6 0 016 6v2"/></svg>
        The road back to POS
      </div>
      <p>${esc(s.road)}</p>
    </div>
    <div class="badge">
      <i><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></i>
      ${esc(s.metric)}
    </div>
    <div class="divider">Next</div>
    ${nextCard(s.id)}`;
  wireBody();
}

function nextCard(id){
  const nxt = STOPS.find(s => s.id === id + 1);
  if (nxt) return `<button class="lcard" data-go="${nxt.id}">
      <div class="lnum">${nxt.id}</div>
      <div><h4>${esc(nxt.title)}</h4><p>${esc(nxt.metric)}</p></div></button>`;
  return `<button class="lcard" data-summit="1">
      <div class="lnum" style="background:var(--blue);border-radius:6px">▲</div>
      <div><h4>Summit: the full ROI picture</h4><p>280% ROI · &lt;12 month payback</p></div></button>`;
}

function reviewsBlock(limit){
  let live = CONFIG.reviews.filter(r => r.quote && r.name);
  const total = live.length;
  if (limit) live = live.slice(0, limit);
  const rows = live.length ? live.map(r => `
      <div class="rev">
        <div class="rev-head">
          <div class="avatar">${esc(r.name.trim()[0] || "\u00b7")}</div>
          <div class="rev-who">
            <b>${esc(r.name)}</b>
            <span>${esc([r.role, r.company].filter(Boolean).join(" \u00b7 "))}</span>
          </div>
        </div>
        <p class="rev-q">${esc(r.quote)}</p>
        ${r.metric ? `<div class="rev-metric">${esc(r.metric)}</div>` : ""}
      </div>`).join("")
    : `<div class="rev todo">
         <p class="rev-q">No approved quotes added yet. Paste them into CONFIG.reviews
         at the top of the script.</p>
       </div>`;
  const more = limit && total > limit
    ? `<button class="lcard" data-tab-go="reports"><div class="lnum" style="background:var(--blue);border-radius:7px">+</div>
        <div><h4>All ${total} trail reports</h4><p>From Teamwork Commerce customers</p></div></button>` : "";
  return `<div class="divider">Trail reports${total ? ` \u00b7 ${total}` : ""}</div>${rows}${more}`;
}

function renderReports(){
  body.innerHTML = `<div class="listwrap">
    <h2 class="t-title">Trail reports</h2>
    <p class="t-place">What retailers running Teamwork Commerce say</p>
    ${reviewsBlock()}</div>`;
  wireBody();
}

function renderStops(){
  body.innerHTML = `
    <div class="listwrap">
      <div class="kicker"><span class="dot"></span> ${visited.size} of 5 stops visited</div>
      <h2 class="s-title">Every stop ends at the register</h2>
      <p class="s-sub">${esc(BASECAMP.sub)}</p>
      <button class="lcard" data-basecamp="1">
        <div class="lnum" style="background:var(--blue);border-radius:7px">◉</div>
        <div><h4>${esc(BASECAMP.title)}</h4><p>280% ROI · 69% lower 3-yr TCO</p></div>
      </button>
      <div class="divider">The five stops</div>
      ${STOPS.map(s => `
        <button class="lcard ${visited.has(s.id) ? "done" : ""}" data-go="${s.id}">
          <div class="lnum">${s.id}</div>
          <div><h4>${esc(s.title)}</h4><p>${esc(s.metric)}</p></div>
        </button>`).join("")}
    </div>`;
  wireBody();
}

function renderSummit(){
  body.innerHTML = `
    <div class="summit">
      <div class="hero">
        <svg class="topo" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          ${[0,1,2,3,4,5,6].map(i => `<path d="${ring(500,520,120+i*95,700+i*11,.2)}" fill="none" stroke="#fff" stroke-width="2"/>`).join("")}
        </svg>
        <div class="in">
          <div class="k">Summit · ${esc(CONFIG.client)}</div>
          <h2>Proven enterprise ROI for high-volume outdoor retail</h2>
          <p>Teamwork Commerce delivers a 280% ROI — $2.81 returned for every $1 spent — and a payback period under 12 months.</p>
        </div>
      </div>
      ${statBlock([
        { n: "280%", l: "Return on investment" },
        { n: "$2.81", l: "Back per $1 spent" },
        { n: "<12 mo", l: "Payback period" }
      ])}
      <div class="logorow">
        <div class="lbl">Trusted by</div>
        <div class="logos">${CONFIG.logos.map(l => `<div class="lg">${
          l.src ? `<img src="${esc(l.src)}" alt="${esc(l.name)}" style="height:${l.h || 22}px">`
                : `<span>${esc(l.name)}</span>`
        }</div>`).join("")}</div>
      </div>
      <button class="btn" data-link="demo">Book a tailored demo</button>
      <button class="btn ghost" data-link="roi">Request a custom ROI model</button>
      <p class="fine">Figures reflect enterprise specialty retail deployments across 40+ countries. Ask for the underlying model and assumptions — we'll show the math for ${esc(CONFIG.client)}'s store count and volume.</p>
    </div>`;
  wireBody();
}

function wireBody(){
  body.querySelectorAll("[data-go]").forEach(b => b.onclick = () => openStop(+b.dataset.go));
  body.querySelectorAll("[data-step]").forEach(b => b.onclick = () => step(+b.dataset.step));
  body.querySelectorAll("[data-summit]").forEach(b => b.onclick = () => go("summit"));
  body.querySelectorAll("[data-tab-go]").forEach(b => b.onclick = () => go(b.dataset.tabGo));
  const sb2 = body.querySelector("#sharebtn2");
  if (sb2) sb2.onclick = () => document.getElementById("sharebtn").click();
  wireCarousel();
  body.querySelectorAll("[data-basecamp]").forEach(b => b.onclick = () => { go("map"); showBasecamp(); });
  body.querySelectorAll("[data-link]").forEach(b => b.onclick = () => {
    const href = CONFIG.links[b.dataset.link];
    if (href && href !== "#") window.open(href, "_blank");
  });
  const start = body.querySelector("#startbtn");
  if (start) start.onclick = () => openStop(1);
  const ts = body.querySelector("#tosummit");
  if (ts) ts.onclick = () => go("summit");
}

/* ---------------- Navigation ---------------- */
const visited = new Set();
let currentStop = null;
let tab = "map";

function clearRoads(){
  document.querySelectorAll(".ret").forEach(p => p.classList.remove("on"));
  Object.values(pinEls).forEach(p => p.classList.remove("active"));
}

function openStop(id){
  const s = STOPS.find(x => x.id === id);
  if (!s) return;
  go("map", true);
  currentStop = id;
  clearRoads();
  pinEls[id].classList.add("active");
  document.getElementById(`ret-${id}`).classList.add("on");
  visited.add(id);
  pinEls[id].classList.add("done");
  updateProgress();
  const v = homeView();
  centerOn((s.x + HUB.x) / 2, (s.y + HUB.y) / 2, Math.min(MAXK, v.k * 1.7), isDesktop() ? .5 : .38);
  renderStop(s);
  setSheet("half");
}

/* Walk the trail in order; stepping past the last stop lands on the Summit. */
function step(dir){
  if (currentStop === null) { openStop(1); return; }
  const n = currentStop + dir;
  if (n < 1) return;
  if (n > STOPS.length) { go("summit"); return; }
  openStop(n);
}
window.addEventListener("keydown", e => {
  if (tab !== "map" || currentStop === null) return;
  if (e.key === "ArrowRight"){ e.preventDefault(); step(1); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); step(-1); }
});

function showBasecamp(){
  go("map", true);
  currentStop = null;
  clearRoads();
  goHome();
  renderBasecamp();
  setSheet("half");
}

function updateProgress(){
  document.getElementById("prog").style.width = (visited.size / STOPS.length * 100) + "%";
  if (visited.size === STOPS.length && !toastShown){
    toastShown = true;
    setTimeout(() => document.getElementById("toast").classList.add("show"), 900);
  }
}
let toastShown = false;
document.getElementById("toastgo").onclick = () => {
  document.getElementById("toast").classList.remove("show");
  go("summit");
};

function go(t, quiet){
  tab = t;
  document.querySelectorAll("nav button[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  const onMap = t === "map";
  legend.classList.toggle("hidden", !onMap);
  zoomer.classList.toggle("hidden", !onMap);
  // Stops and Summit are full pages, not cards over the map.
  sheet.classList.toggle("deep", !onMap);
  const sf = document.getElementById("summitflag");
  if (sf) sf.classList.toggle("on", t === "summit");
  if (t === "summit"){
    document.querySelectorAll(".ret").forEach(p => p.classList.remove("on"));
    Object.values(pinEls).forEach(p => p.classList.remove("active"));
    const rs = document.getElementById("ret-summit");
    if (rs) rs.classList.add("on");
  }
  if (quiet) return;
  if (t === "map"){ showBasecamp(); }
  if (t === "stops"){ renderStops(); setSheet("full"); }
  if (t === "reports"){ renderReports(); setSheet("full"); }
  if (t === "summit"){ renderSummit(); setSheet("full"); }
}
document.querySelectorAll("nav button[data-tab]").forEach(b => b.onclick = () => go(b.dataset.tab));

document.getElementById("backbtn").onclick = () => {
  if (tab !== "map") { go("map"); return; }
  if (currentStop !== null) { showBasecamp(); return; }
  goHome();
  setSheet("peek");
};
document.getElementById("sharebtn").onclick = async () => {
  const data = { title: document.title, url: location.href };
  if (navigator.share) { try { await navigator.share(data); } catch (e) {} }
  else if (navigator.clipboard) { try { await navigator.clipboard.writeText(location.href); } catch (e) {} }
};

/* ---------------- Boot ---------------- */
document.body.classList.toggle("framed", CONFIG.presentation === "device");
document.getElementById("apptitle").textContent = CONFIG.trailName;
document.getElementById("splashwd").textContent = CONFIG.trailName;
document.title = `${CONFIG.trailName} — Powered by Teamwork Commerce`;

k = 1; tx = 0; ty = 0;
measure();
applyTransform();
renderBasecamp();
setSheet("peek");
goHome();

const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
setTimeout(() => {
  document.getElementById("splash").classList.add("gone");
  setTimeout(() => setSheet("peek"), 200);
}, reduce ? 120 : 1650);

/* Failsafe: never leave the splash covering the app, and surface the reason. */
window.addEventListener("error", e => {
  const sp = document.getElementById("splash");
  if (sp) sp.classList.add("gone");
  const b = document.getElementById("sheetbody");
  if (b && !b.children.length){
    b.innerHTML = `<h2 class="s-title">Something failed to load</h2>
      <p class="s-sub" style="font-family:var(--font-mono);font-size:12px">${
        String(e.message || e.error || "Unknown error")}</p>`;
  }
});

let rzTimer;
function onResize(){
  measure();
  applyTransform();
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => { if (tab === "map" && currentStop === null) goHome(); }, 160);
}
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", () => setTimeout(onResize, 250));
</script>
</body>
</html>
